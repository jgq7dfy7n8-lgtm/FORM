<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORM">
<title>FORM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo+Black&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0a0a0a; color: #fff; font-family: 'DM Sans', sans-serif; font-weight: 500; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  /* Custom scrollbar — visible on the running card */
  .card::-webkit-scrollbar { width: 4px; }
  .card::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 2px; }
  .card::-webkit-scrollbar-thumb { background: rgba(0,230,118,0.5); border-radius: 2px; }
  .card::-webkit-scrollbar-thumb:hover { background: #00e676; }
  .ov-list::-webkit-scrollbar, .detail-scroll::-webkit-scrollbar, .lib-list::-webkit-scrollbar { width: 4px; }
  .ov-list::-webkit-scrollbar-thumb, .detail-scroll::-webkit-scrollbar-thumb, .lib-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  /* Scroll fade indicator at bottom of card */
  .card-wrap { flex: 1; position: relative; min-height: 0; display: flex; flex-direction: column; }
  .card-wrap::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24px; background: linear-gradient(to top, #0a0a0a, rgba(10,10,10,0)); pointer-events: none; z-index: 5; }
  .scroll-hint { position: absolute; right: 14px; bottom: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 10px; letter-spacing: 0.2em; color: rgba(0,230,118,0.6); z-index: 6; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  .scroll-hint.visible { opacity: 1; animation: bounce 1.4s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

  /* ============ LIBRARY ============ */
  .library { flex: 1; display: flex; flex-direction: column; padding: 24px 20px 0; min-height: 0; }
  .lib-tag { font-family: 'Archivo Black', sans-serif; font-size: 12px; letter-spacing: 0.32em; color: #00e676; margin-bottom: 10px; margin-top: 16px; text-transform: uppercase; }
  .lib-brand { font-family: 'Bebas Neue', sans-serif; font-size: 64px; line-height: 0.95; letter-spacing: 0.04em; -webkit-text-stroke: 0.5px #fff; }
  .lib-sub { color: rgba(255,255,255,0.6); font-size: 14px; font-weight: 500; margin: 14px 0 24px; line-height: 1.4; }
  .lib-section-label { font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.28em; color: rgba(255,255,255,0.5); margin: 0 0 12px; text-transform: uppercase; }
  .lib-list { display: flex; flex-direction: column; gap: 12px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .workout-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px 18px 16px; position: relative; cursor: pointer; transition: transform 0.1s; }
  .workout-card:active { transform: scale(0.99); }
  .workout-card.fatloss { border-left: 3px solid #ff5252; }
  .workout-card.chest { border-left: 3px solid #ec407a; }
  .workout-card.push { border-left: 3px solid #00e676; }
  .workout-card.pull { border-left: 3px solid #40c4ff; }
  .workout-card.lower { border-left: 3px solid #ffb74d; }
  .workout-card.backarms { border-left: 3px solid #7c4dff; }
  .card-eyebrow { font-family: 'Archivo Black', sans-serif; font-size: 10px; letter-spacing: 0.28em; color: rgba(255,255,255,0.55); margin-bottom: 6px; text-transform: uppercase; }
  .card-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; line-height: 0.95; letter-spacing: 0.02em; margin-bottom: 8px; -webkit-text-stroke: 0.4px #fff; }
  .card-meta { display: flex; gap: 10px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6); }
  .card-arrow { position: absolute; top: 50%; right: 18px; transform: translateY(-50%); font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: rgba(255,255,255,0.35); }

  /* ============ DETAIL ============ */
  .detail { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .detail-top { display: flex; align-items: center; padding: 16px 20px 8px; flex-shrink: 0; }
  .icon-btn { background: none; border: none; color: rgba(255,255,255,0.7); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 6px 8px 6px 0; }
  .detail-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 24px 16px; min-height: 0; }
  .detail-eyebrow { font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.32em; color: #00e676; margin-bottom: 6px; text-transform: uppercase; }
  .detail-title { font-family: 'Bebas Neue', sans-serif; font-size: 64px; line-height: 0.92; letter-spacing: 0.02em; margin: 8px 0 14px; -webkit-text-stroke: 0.5px #fff; }
  .detail-sub { color: rgba(255,255,255,0.65); font-size: 15px; font-weight: 500; line-height: 1.5; margin-bottom: 20px; }
  .stats-row { display: flex; gap: 10px; margin-bottom: 24px; }
  .stat { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px 12px; text-align: center; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 38px; line-height: 1; color: #00e676; margin-bottom: 4px; -webkit-text-stroke: 0.5px #00e676; }
  .stat-label { font-family: 'Archivo Black', sans-serif; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
  .section-block { margin-bottom: 14px; padding: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; }
  .section-block.warmup { border-left: 3px solid #ffb74d; }
  .section-block.strength { border-left: 3px solid #00e676; }
  .section-block.metcon { border-left: 3px solid #ff5252; }
  .section-block.core { border-left: 3px solid #40c4ff; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .section-name { font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: 0.18em; -webkit-text-stroke: 0.3px #fff; }
  .section-rounds { font-family: 'Archivo Black', sans-serif; font-size: 12px; letter-spacing: 0.18em; }
  .section-block.warmup .section-rounds { color: #ffb74d; }
  .section-block.strength .section-rounds { color: #00e676; }
  .section-block.metcon .section-rounds { color: #ff5252; }
  .section-block.core .section-rounds { color: #40c4ff; }
  .ex-mini-list { display: flex; flex-direction: column; gap: 4px; }
  .ex-mini { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .ex-mini:last-child { border-bottom: none; }
  .ex-mini-name { color: rgba(255,255,255,0.9); }
  .pair-tag { display: inline-block; font-family: 'Archivo Black', sans-serif; font-size: 10px; color: #ff5252; margin-right: 6px; letter-spacing: 0.1em; padding: 2px 6px; background: rgba(255,82,82,0.12); border-radius: 4px; }
  .ex-mini-detail { color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; }
  .detail-footer { flex-shrink: 0; padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to top, #0a0a0a 60%, rgba(10,10,10,0)); }
  .start-cta { width: 100%; padding: 22px; background: #00e676; color: #0a0a0a; border: none; border-radius: 14px; font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.22em; cursor: pointer; box-shadow: 0 8px 24px rgba(0,230,118,0.3); -webkit-text-stroke: 0.4px #0a0a0a; }
  .start-cta:active { transform: scale(0.99); }

  /* ============ RUNNING — TOP NAV ============ */
  /* Section progress bar — chunked by section, not flat */
  .section-progress { display: flex; gap: 3px; padding: 10px 16px 6px; flex-shrink: 0; }
  .sp-section { flex: 1; height: 4px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; position: relative; display: flex; gap: 1px; }
  .sp-pip { flex: 1; background: rgba(255,255,255,0.18); border-radius: 1px; transition: background 0.2s; }
  .sp-pip.done { background: rgba(255,255,255,0.55); }
  .sp-pip.active { background: #00e676; box-shadow: 0 0 6px #00e676; }
  .sp-pip.active.warmup { background: #ffb74d; box-shadow: 0 0 6px #ffb74d; }
  .sp-pip.active.metcon { background: #ff5252; box-shadow: 0 0 6px #ff5252; }
  .sp-pip.active.core { background: #40c4ff; box-shadow: 0 0 6px #40c4ff; }
  .sp-section-label { font-family: 'Bebas Neue', sans-serif; font-size: 9px; letter-spacing: 0.18em; color: rgba(255,255,255,0.35); text-align: center; padding: 4px 4px 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-section-label.active { color: #00e676; }
  .sp-section-label.active.warmup { color: #ffb74d; }
  .sp-section-label.active.metcon { color: #ff5252; }
  .sp-section-label.active.core { color: #40c4ff; }
  .sp-labels { display: flex; gap: 3px; padding: 0 16px 8px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 8px; flex-shrink: 0; }
  .back { background: none; border: none; color: rgba(255,255,255,0.75); font-family: 'Archivo Black', sans-serif; font-size: 11px; padding: 6px 10px 6px 0; letter-spacing: 0.16em; text-transform: uppercase; }
  .step-counter { font-family: 'Archivo Black', sans-serif; font-size: 12px; letter-spacing: 0.22em; color: rgba(255,255,255,0.6); }

  /* Persistent jump bar (always visible) */
  .jump-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; margin: 0 16px 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
  .jump-bar:active { background: rgba(255,255,255,0.1); }
  .jump-bar.warmup { border-left: 3px solid #ffb74d; }
  .jump-bar.strength { border-left: 3px solid #00e676; }
  .jump-bar.metcon { border-left: 3px solid #ff5252; }
  .jump-bar.core { border-left: 3px solid #40c4ff; }
  .jump-bar.rest { border-left: 3px solid #40c4ff; }
  .jump-section { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 0.2em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; -webkit-text-stroke: 0.3px #fff; }
  .jump-round { font-family: 'Archivo Black', sans-serif; font-size: 12px; letter-spacing: 0.14em; color: rgba(255,255,255,0.7); }
  .jump-arrow { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: rgba(255,255,255,0.55); margin-left: 4px; }

  /* ============ RUNNING — CARD ============ */
  .card { flex: 1; display: flex; flex-direction: column; padding: 4px 24px 16px; position: relative; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ex-name { font-family: 'Bebas Neue', sans-serif; font-size: 56px; line-height: 0.92; letter-spacing: 0.02em; margin-bottom: 14px; -webkit-text-stroke: 0.6px #fff; }
  .ex-meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .meta-pill { font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 7px 13px; border-radius: 100px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.9); }
  .meta-pill.accent { background: rgba(0,230,118,0.15); border-color: rgba(0,230,118,0.5); color: #00e676; }
  .meta-pill.pair { background: rgba(255,82,82,0.15); border-color: rgba(255,82,82,0.5); color: #ff5252; }

  .pair-preview { background: rgba(255,82,82,0.08); border: 1px solid rgba(255,82,82,0.22); border-radius: 10px; padding: 11px 14px; margin-bottom: 14px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); }
  .pair-preview strong { color: #ff5252; font-family: 'Archivo Black', sans-serif; letter-spacing: 0.12em; margin-right: 8px; font-size: 12px; }

  /* Instruction card */
  .instructions { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .ins-section { margin-bottom: 12px; }
  .ins-section:last-child { margin-bottom: 0; }
  .ins-label { font-family: 'Archivo Black', sans-serif; font-size: 10px; letter-spacing: 0.26em; color: #00e676; margin-bottom: 6px; text-transform: uppercase; }
  .ins-text { font-size: 14px; font-weight: 500; line-height: 1.55; color: rgba(255,255,255,0.92); }
  .ins-list { padding-left: 0; list-style: none; }
  .ins-list li { font-size: 14px; font-weight: 500; line-height: 1.55; color: rgba(255,255,255,0.88); padding: 3px 0 3px 16px; position: relative; }
  .ins-list li:before { content: "▸"; position: absolute; left: 2px; color: #00e676; font-size: 11px; top: 5px; }
  .ins-warning { background: rgba(255,82,82,0.1); border-left: 3px solid #ff5252; padding: 10px 12px; border-radius: 4px; }
  .ins-warning .ins-label { color: #ff5252; }
  .ins-warning .ins-list li:before { color: #ff5252; }

  /* Alternatives — collapsible swap section */
  .alts-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; background: rgba(64,196,255,0.08); border: 1px solid rgba(64,196,255,0.25); border-left: 3px solid #40c4ff; border-radius: 8px; padding: 11px 13px; margin-bottom: 14px; cursor: pointer; font-family: 'Bebas Neue', sans-serif; }
  .alts-toggle:active { background: rgba(64,196,255,0.14); }
  .alts-toggle-label { display: flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: 0.16em; color: #40c4ff; }
  .alts-toggle-icon { font-family: 'Archivo Black', sans-serif; font-size: 10px; letter-spacing: 0.1em; color: #40c4ff; padding: 3px 7px; background: rgba(64,196,255,0.18); border-radius: 4px; }
  .alts-chev { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: rgba(64,196,255,0.7); transition: transform 0.2s; }
  .alts-toggle.open .alts-chev { transform: rotate(180deg); }
  .alts-content { display: none; margin: -8px 0 14px; padding: 12px 14px; background: rgba(64,196,255,0.05); border: 1px solid rgba(64,196,255,0.18); border-left: 3px solid #40c4ff; border-radius: 0 0 8px 8px; }
  .alts-content.open { display: block; }
  .alt-item { padding: 10px 0; border-bottom: 1px solid rgba(64,196,255,0.12); }
  .alt-item:first-child { padding-top: 0; }
  .alt-item:last-child { border-bottom: none; padding-bottom: 0; }
  .alt-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.1em; color: #fff; margin-bottom: 4px; -webkit-text-stroke: 0.3px #fff; }
  .alt-name-tag { font-family: 'Archivo Black', sans-serif; font-size: 9px; color: #40c4ff; padding: 2px 6px; background: rgba(64,196,255,0.18); border-radius: 4px; letter-spacing: 0.1em; margin-right: 8px; vertical-align: middle; position: relative; top: -2px; }
  .alt-desc { font-size: 13px; font-weight: 500; line-height: 1.5; color: rgba(255,255,255,0.8); }

  /* Timer area (only for timed blocks) */
  .next-up-card { background: rgba(0,230,118,0.08); border: 1px solid rgba(0,230,118,0.3); border-left: 3px solid #00e676; border-radius: 12px; padding: 14px 16px; margin: 4px 0 14px; }
  .next-up-label { font-family: 'Archivo Black', sans-serif; font-size: 10px; letter-spacing: 0.28em; color: #00e676; margin-bottom: 6px; text-transform: uppercase; }
  .next-up-name { font-family: 'Bebas Neue', sans-serif; font-size: 32px; line-height: 1; letter-spacing: 0.02em; -webkit-text-stroke: 0.4px #fff; margin-bottom: 10px; color: #fff; }
  .next-up-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .timer-area { display: flex; flex-direction: column; align-items: center; padding: 16px 0 8px; gap: 10px; }
  .timer { font-family: 'Bebas Neue', sans-serif; font-size: 130px; line-height: 1; letter-spacing: 0.01em; color: #fff; font-variant-numeric: tabular-nums; -webkit-text-stroke: 1px #fff; }
  .timer.rest { color: #40c4ff; -webkit-text-stroke: 1px #40c4ff; }
  .timer.warmup { color: #ffb74d; -webkit-text-stroke: 1px #ffb74d; }
  .timer.metcon { color: #ff5252; -webkit-text-stroke: 1px #ff5252; }
  .timer.paused { opacity: 0.35; }
  .timer-label { font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.32em; color: rgba(255,255,255,0.55); text-transform: uppercase; }
  .timer-controls { display: flex; gap: 10px; margin-top: 4px; }
  .pause-btn { padding: 13px 30px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.22); color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.22em; border-radius: 100px; cursor: pointer; min-width: 140px; }
  .pause-btn.paused { background: rgba(0,230,118,0.18); border-color: #00e676; color: #00e676; }
  .pause-btn.ready { background: #00e676; border-color: #00e676; color: #0a0a0a; padding: 16px 40px; font-size: 19px; box-shadow: 0 6px 22px rgba(0,230,118,0.4); }
  .pause-btn:active { transform: scale(0.97); }

  /* Reps display (no timer) */
  .reps-display { display: flex; flex-direction: column; align-items: center; padding: 16px 0 12px; gap: 8px; }
  .reps-num { font-family: 'Bebas Neue', sans-serif; font-size: 130px; line-height: 1; letter-spacing: 0.01em; color: #00e676; font-variant-numeric: tabular-nums; -webkit-text-stroke: 1.5px #00e676; }
  .reps-label { font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.32em; color: rgba(255,255,255,0.55); text-transform: uppercase; }

  /* ============ RUNNING — BOTTOM BAR ============ */
  .bottom-bar { flex-shrink: 0; padding: 10px 20px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, #0a0a0a 60%, rgba(10,10,10,0)); display: flex; flex-direction: column; gap: 8px; }
  .next-btn { width: 100%; padding: 20px; background: #00e676; color: #0a0a0a; border: none; border-radius: 14px; font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.2em; cursor: pointer; -webkit-text-stroke: 0.5px #0a0a0a; box-shadow: 0 6px 20px rgba(0,230,118,0.25); }
  .next-btn.rest { background: #40c4ff; box-shadow: 0 6px 20px rgba(64,196,255,0.25); }
  .next-btn.warmup { background: #ffb74d; box-shadow: 0 6px 20px rgba(255,183,77,0.25); }
  .next-btn.metcon { background: #ff5252; color: #fff; -webkit-text-stroke: 0.5px #fff; box-shadow: 0 6px 20px rgba(255,82,82,0.3); }
  .next-btn:active { transform: scale(0.98); }
  .secondary-row { display: flex; gap: 10px; }
  .sec-btn { flex: 1; padding: 11px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.18em; cursor: pointer; text-transform: uppercase; }
  .sec-btn:active { background: rgba(255,255,255,0.12); }

  /* ============ FULL OVERVIEW SCREEN ============ */
  .overview-screen { position: fixed; inset: 0; background: #0a0a0a; z-index: 60; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
  .overview-screen.open { transform: translateY(0); }
  .ov-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; flex-shrink: 0; }
  .ov-close { background: none; border: none; color: rgba(255,255,255,0.75); font-family: 'Archivo Black', sans-serif; font-size: 11px; padding: 6px 10px; letter-spacing: 0.16em; text-transform: uppercase; }
  .ov-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.2em; -webkit-text-stroke: 0.3px #fff; }
  .ov-spacer { width: 60px; }
  .ov-sub { padding: 0 20px 12px; font-family: 'Archivo Black', sans-serif; font-size: 10px; color: rgba(255,255,255,0.55); letter-spacing: 0.18em; flex-shrink: 0; text-transform: uppercase; }
  .ov-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 24px; }
  .ov-section { margin-bottom: 16px; padding: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; }
  .ov-section.warmup { border-left: 3px solid #ffb74d; }
  .ov-section.strength { border-left: 3px solid #00e676; }
  .ov-section.metcon { border-left: 3px solid #ff5252; }
  .ov-section.core { border-left: 3px solid #40c4ff; }

// ============================================================
// STATE
// ============================================================
let state = {
  screen: "library",
  workoutId: null,
  index: 0,
  timeLeft: 0,
  timerId: null,
  startTime: null,
  paused: true,
  started: false,
  overviewOpen: false
};

const app = document.getElementById("app");
const overviewScreen = document.getElementById("overview-screen");

function getWorkout() { return workouts.find(w => w.id === state.workoutId); }
function fmt(s) { const m = Math.floor(s / 60); const sec = s % 60; return m > 0 ? m + ":" + sec.toString().padStart(2,"0") : ":" + sec.toString().padStart(2,"0"); }
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {} }

// safeTap — let the browser's native click handle scroll-vs-tap detection.
// Browsers already do this correctly: a click fires only when finger goes down
// and up at roughly the same spot. By NOT adding touchend handlers, we stop
// fighting the browser's built-in scroll detection.
function safeTap(el, fn) {
  el.addEventListener("click", function(e) {
    e.preventDefault();
    fn(e);
  });
}

// ============================================================
// LIBRARY
// ============================================================
function renderLibrary() {
  state.screen = "library";
  state.workoutId = null;
  closeOverview();

  let cardsHtml = "";
  for (const w of workouts) {
    const totalSecs = w.blocks.reduce((acc, b) => acc + (b.type === "timed" ? b.duration : 60), 0);
    const totalMin = Math.round(totalSecs / 60);
    const exCount = new Set(w.blocks.filter(b => b.phase !== "rest").map(b => b.name)).size;
    cardsHtml += '<div class="workout-card ' + w.theme + '" data-id="' + w.id + '">' +
      '<div class="card-eyebrow">' + w.eyebrow + '</div>' +
      '<div class="card-title">' + w.name + '</div>' +
      '<div class="card-meta"><span>~' + totalMin + ' min</span><span>•</span><span>' + exCount + ' exercises</span></div>' +
      '<div class="card-arrow">→</div></div>';
  }

  app.innerHTML = '<div class="library">' +
    '<div class="lib-tag">FORM</div>' +
    '<div class="lib-brand">WORKOUT<br>LIBRARY</div>' +
    '<div class="lib-sub">5 dumbbell-focused programs. Tap one to see the plan.</div>' +
    '<div class="lib-section-label">PROGRAMS</div>' +
    '<div class="lib-list">' + cardsHtml + '</div>' +
    '</div>';

  document.querySelectorAll(".workout-card").forEach(card => {
    safeTap(card, function(){ openDetail(card.dataset.id); });
  });
}

// ============================================================
// DETAIL
// ============================================================
function openDetail(id) {
  state.workoutId = id;
  state.screen = "detail";
  renderDetail();
}

function renderDetail() {
  const w = getWorkout();
  if (!w) return renderLibrary();

  const totalSecs = w.blocks.reduce((acc, b) => acc + (b.type === "timed" ? b.duration : 60), 0);
  const totalMin = Math.round(totalSecs / 60);
  const pairCount = w.sections.filter(s => s.items.some(i => i.pair)).length;

  let sectionsHtml = "";
  for (const sec of w.sections) {
    let itemsHtml = "";
    for (const it of sec.items) {
      const tag = it.pair ? '<span class="pair-tag">' + it.pair + '</span>' : "";
      itemsHtml += '<div class="ex-mini"><div class="ex-mini-name">' + tag + it.name + '</div><div class="ex-mini-detail">' + it.detail + '</div></div>';
    }
    sectionsHtml += '<div class="section-block ' + sec.cls + '"><div class="section-head"><div class="section-name">' + sec.label + '</div><div class="section-rounds">' + sec.rounds + '</div></div><div class="ex-mini-list">' + itemsHtml + '</div></div>';
  }

  app.innerHTML = '<div class="detail">' +
    '<div class="detail-top"><button class="icon-btn" id="back-lib">← Library</button></div>' +
    '<div class="detail-scroll">' +
      '<div class="detail-eyebrow">' + w.eyebrow + '</div>' +
      '<div class="detail-title">' + w.name + '</div>' +
      '<div class="detail-sub">' + w.description + '</div>' +
      '<div class="stats-row">' +
        '<div class="stat"><div class="stat-num">' + totalMin + '</div><div class="stat-label">Minutes</div></div>' +
        '<div class="stat"><div class="stat-num">' + w.sections.length + '</div><div class="stat-label">Sections</div></div>' +
        '<div class="stat"><div class="stat-num">' + pairCount + '</div><div class="stat-label">Pairs</div></div>' +
      '</div>' +
      sectionsHtml +
    '</div>' +
    '<div class="detail-footer"><button class="start-cta" id="start-btn">START WORKOUT →</button></div>' +
    '</div>';

  document.getElementById("back-lib").addEventListener("touchend", function(e){ e.preventDefault(); renderLibrary(); });
  document.getElementById("back-lib").addEventListener("click", renderLibrary);
  document.getElementById("start-btn").addEventListener("touchend", function(e){ e.preventDefault(); startWorkout(); });
  document.getElementById("start-btn").addEventListener("click", startWorkout);
}

// ============================================================
// RUNNING
// ============================================================
function startWorkout() {
  state.screen = "running";
  state.index = 0;
  state.startTime = Date.now();
  loadBlock();
}

function loadBlock() {
  const w = getWorkout();
  const b = w.blocks[state.index];
  if (!b) { finishWorkout(); return; }
  // Rest blocks auto-start (no manual tap needed). Active timed blocks (warmup, planks, conditioning) wait for tap.
  const isRestBlock = b.phase === "rest";
  state.paused = !isRestBlock;
  state.started = isRestBlock;
  if (b.type === "timed") {
    state.timeLeft = b.duration;
    renderRunning();
    startTimer();
  } else {
    renderRunning();
  }
}

function startTimer() {
  clearInterval(state.timerId);
  state.timerId = setInterval(function() {
    if (state.paused) return;
    state.timeLeft--;
    updateTimerDisplay();
    if (state.timeLeft <= 0) {
      clearInterval(state.timerId);
      vibrate(200);
      next();
    } else if (state.timeLeft <= 3) {
      vibrate(40);
    }
  }, 1000);
}

function togglePause() {
  state.paused = !state.paused;
  state.started = state.started || !state.paused;
  vibrate(30);
  const timerEl = document.getElementById("timer-num");
  const btn = document.getElementById("pause-btn");
  if (timerEl) timerEl.classList.toggle("paused", state.paused);
  if (btn) {
    btn.classList.toggle("paused", state.paused && state.started);
    btn.classList.toggle("ready", !state.started && state.paused);
    if (!state.started && state.paused) btn.textContent = "▶  START";
    else if (state.paused) btn.textContent = "▶  RESUME";
    else btn.textContent = "❚❚  PAUSE";
  }
}

function updateTimerDisplay() {
  const t = document.getElementById("timer-num");
  if (t) t.textContent = fmt(state.timeLeft);
}

function next() {
  clearInterval(state.timerId);
  state.index++;
  const w = getWorkout();
  if (state.index >= w.blocks.length) finishWorkout();
  else loadBlock();
}

function back() {
  clearInterval(state.timerId);
  if (state.index > 0) { state.index--; loadBlock(); }
}

function exitToDetail() {
  clearInterval(state.timerId);
  closeOverview();
  renderDetail();
}

function jumpToBlock(idx) {
  clearInterval(state.timerId);
  const w = getWorkout();
  if (!w || idx < 0 || idx >= w.blocks.length) return;
  state.index = idx;
  vibrate(40);
  loadBlock();
}

// ============================================================
// SECTION GROUPING (for progress bar + overview)
// ============================================================
function getSectionGroups() {
  const w = getWorkout();
  if (!w) return [];
  const groups = [];
  let cur = null;
  w.blocks.forEach((b, idx) => {
    const label = b.blockLabel || "OTHER";
    // Rest blocks adopt the group of their block label
    if (!cur || cur.label !== label) {
      const phase = b.phase === "rest" ? (cur ? cur.phase : "warmup") : b.phase;
      cur = { label: label, phase: phase, blocks: [] };
      groups.push(cur);
    }
    cur.blocks.push({ b: b, idx: idx });
  });
  return groups;
}

// ============================================================
// RUNNING RENDER
// ============================================================
function renderRunning() {
  const w = getWorkout();
  const b = w.blocks[state.index];
  const total = w.blocks.length;
  const groups = getSectionGroups();

  // ===== Section progress bar =====
  let progressHtml = '<div class="section-progress">';
  let labelsHtml = '<div class="sp-labels">';
  for (const g of groups) {
    const isCurrentGroup = g.blocks.some(x => x.idx === state.index);
    let pipsHtml = "";
    for (const x of g.blocks) {
      const cls = x.idx < state.index ? "done" : x.idx === state.index ? ("active " + g.phase) : "";
      pipsHtml += '<div class="sp-pip ' + cls + '"></div>';
    }
    progressHtml += '<div class="sp-section">' + pipsHtml + '</div>';
    const labelCls = isCurrentGroup ? "sp-section-label active " + g.phase : "sp-section-label";
    labelsHtml += '<div class="' + labelCls + '">' + g.label.replace(/PAIR /, '').replace(/STRENGTH /, 'S').replace(/METCON /, 'M').replace(/FINISHER /, 'F').replace(/HYPERTROPHY /, 'H').replace(/CORE FINISHER/, 'CORE').replace(/WARM UP/, 'WARM').replace(/ARMS /, 'ARM').replace(/ → /, '→').slice(0, 8) + '</div>';
  }
  progressHtml += '</div>';
  labelsHtml += '</div>';

  const phaseLabels = { warmup: "WARM UP", strength: "STRENGTH", metcon: "WORK", core: "CORE", rest: "REST" };
  const isRest = b.phase === "rest";
  const colorClass = b.phase;

  // ===== Find next active (non-rest) block for "next up" preview =====
  let nextUp = null;
  if (isRest) {
    for (let i = state.index + 1; i < w.blocks.length; i++) {
      if (w.blocks[i].phase !== "rest") { nextUp = w.blocks[i]; break; }
    }
  }
  const nextUpHtml = nextUp ? (
    '<div class="next-up-card"><div class="next-up-label">↓ NEXT UP</div>' +
    '<div class="next-up-name">' + nextUp.name.toUpperCase() + '</div>' +
    '<div class="next-up-meta">' +
    (nextUp.pair ? '<span class="meta-pill pair">' + nextUp.pair + '</span>' : '') +
    '<span class="meta-pill accent">' + nextUp.detail + '</span>' +
    '</div></div>'
  ) : "";

  // ===== Persistent jump bar =====
  const roundText = b.roundTotal ? "R" + b.roundCurrent + "/" + b.roundTotal : "";
  const jumpHtml = '<div class="jump-bar ' + colorClass + '" id="jump-bar">' +
    '<div class="jump-section">' + (b.blockLabel || phaseLabels[b.phase]) + '</div>' +
    (roundText ? '<div class="jump-round">' + roundText + '</div>' : '') +
    '<div class="jump-arrow">≡</div></div>';

  // ===== Pair preview =====
  let pairHtml = "";
  if (b.pair && b.pairWith) {
    pairHtml = '<div class="pair-preview"><strong>' + b.pair + '</strong>Pairs with: <strong style="color:#fff;font-family:DM Sans;font-size:13px">' + b.pairWith + '</strong></div>';
  }

  // ===== Instructions block =====
  let insHtml = "";
  if (b.instructions) {
    const ins = b.instructions;
    let parts = "";
    if (ins.setup) parts += '<div class="ins-section"><div class="ins-label">SETUP</div><div class="ins-text">' + ins.setup + '</div></div>';
    if (ins.execution && ins.execution.length) {
      parts += '<div class="ins-section"><div class="ins-label">EXECUTION</div><ul class="ins-list">' + ins.execution.map(x => '<li>' + x + '</li>').join('') + '</ul></div>';
    }
    if (ins.target) parts += '<div class="ins-section"><div class="ins-label">TARGET</div><div class="ins-text">' + ins.target + '</div></div>';
    if (ins.mistakes && ins.mistakes.length) {
      parts += '<div class="ins-section ins-warning"><div class="ins-label">AVOID</div><ul class="ins-list">' + ins.mistakes.map(x => '<li>' + x + '</li>').join('') + '</ul></div>';
    }
    if (parts) insHtml = '<div class="instructions">' + parts + '</div>';
  } else if (b.cue) {
    insHtml = '<div class="instructions"><div class="ins-section"><div class="ins-label">NOTE</div><div class="ins-text">' + b.cue + '</div></div></div>';
  }

  // ===== Alternatives (collapsible) =====
  let altsHtml = "";
  if (b.alternatives && b.alternatives.length) {
    let altItemsHtml = "";
    b.alternatives.forEach((alt, i) => {
      altItemsHtml += '<div class="alt-item"><div class="alt-name"><span class="alt-name-tag">OPT ' + (i + 2) + '</span>' + alt.name + '</div><div class="alt-desc">' + alt.desc + '</div></div>';
    });
    altsHtml = '<button class="alts-toggle" id="alts-toggle"><div class="alts-toggle-label"><span class="alts-toggle-icon">SWAP</span>NO EQUIPMENT? ' + b.alternatives.length + ' ALTERNATIVE' + (b.alternatives.length > 1 ? 'S' : '') + '</div><div class="alts-chev">▾</div></button>' +
      '<div class="alts-content" id="alts-content">' + altItemsHtml + '</div>';
  }

  // ===== Timer or reps display =====
  let displayHtml = "";
  if (b.type === "timed") {
    const tcls = colorClass;
    const timerCls = isRest ? tcls : "paused " + tcls;  // rest = running (no paused class); active = paused awaiting tap
    const btnText = isRest ? "❚❚  PAUSE" : "▶  START";
    const btnCls = isRest ? "pause-btn" : "pause-btn ready";
    displayHtml = '<div class="timer-area">' +
      '<div class="timer-label">' + (isRest ? "REST" : "TIME") + '</div>' +
      '<div class="timer ' + timerCls + '" id="timer-num">' + fmt(state.timeLeft) + '</div>' +
      '<div class="timer-controls"><button class="' + btnCls + '" id="pause-btn">' + btnText + '</button></div>' +
      '</div>';
  } else if (b.type === "reps") {
    displayHtml = '<div class="reps-display">' +
      '<div class="reps-label">REPS</div>' +
      '<div class="reps-num">' + b.reps + '</div>' +
      '</div>';
  }

  const btnClass = isRest ? "rest" : b.phase === "warmup" ? "warmup" : b.phase === "metcon" ? "metcon" : "";
  const btnText = b.type === "reps" ? "DONE → NEXT" : "NEXT →";

  app.innerHTML =
    progressHtml + labelsHtml +
    '<div class="topbar">' +
      '<button class="back" id="back-btn">← Prev</button>' +
      '<div class="step-counter">' + (state.index + 1) + ' / ' + total + '</div>' +
      '<button class="back" id="exit-btn" style="text-align:right;">Exit</button>' +
    '</div>' +
    jumpHtml +
    '<div class="card-wrap">' +
    '<div class="card" id="card-scroll">' +
      '<div class="ex-name">' + b.name.toUpperCase() + '</div>' +
      '<div class="ex-meta-row">' +
        '<span class="meta-pill accent">' + b.detail + '</span>' +
        (b.pair ? '<span class="meta-pill pair">' + b.pair + '</span>' : '') +
      '</div>' +
      pairHtml +
      insHtml +
      altsHtml +
      nextUpHtml +
      displayHtml +
    '</div>' +
    '<div class="scroll-hint" id="scroll-hint">↓ SCROLL FOR MORE</div>' +
    '</div>' +
    '<div class="bottom-bar">' +
      '<button class="next-btn ' + btnClass + '" id="next-btn">' + btnText + '</button>' +
      (b.type === "timed" ? '<div class="secondary-row"><button class="sec-btn" id="skip-btn">SKIP</button></div>' : '') +
    '</div>';

  attachRunningHandlers();
  setupScrollHint();
}

function setupScrollHint() {
  const card = document.getElementById("card-scroll");
  const hint = document.getElementById("scroll-hint");
  if (!card || !hint) return;
  const checkOverflow = () => {
    const isOverflowing = card.scrollHeight > card.clientHeight + 4;
    const isAtBottom = card.scrollTop + card.clientHeight >= card.scrollHeight - 8;
    hint.classList.toggle("visible", isOverflowing && !isAtBottom);
  };
  card.addEventListener("scroll", checkOverflow);
  // Check after layout settles
  setTimeout(checkOverflow, 80);
  setTimeout(checkOverflow, 300);
}

function attachRunningHandlers() {
  const t = (id, fn) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("touchend", function(e){ e.preventDefault(); fn(); });
    el.addEventListener("click", fn);
  };
  t("next-btn", next);
  t("skip-btn", next);
  t("back-btn", back);
  t("exit-btn", exitToDetail);
  t("pause-btn", togglePause);
  t("jump-bar", openOverview);
  t("alts-toggle", toggleAlts);
}

function toggleAlts() {
  const toggle = document.getElementById("alts-toggle");
  const content = document.getElementById("alts-content");
  if (!toggle || !content) return;
  toggle.classList.toggle("open");
  content.classList.toggle("open");
  vibrate(20);
  // Reflow scroll hint after content height changes
  setTimeout(() => {
    if (typeof setupScrollHint === "function") setupScrollHint();
  }, 50);
}

// ============================================================
// OVERVIEW (full-screen)
// ============================================================
function openOverview() {
  state.overviewOpen = true;
  renderOverview();
  overviewScreen.classList.add("open");
}

function closeOverview() {
  state.overviewOpen = false;
  overviewScreen.classList.remove("open");
}

function renderOverview() {
  const w = getWorkout();
  if (!w) return;
  document.getElementById("ov-title").textContent = w.name;
  const remaining = w.blocks.length - state.index - 1;
  document.getElementById("ov-sub").textContent = "STEP " + (state.index + 1) + " / " + w.blocks.length + " • " + remaining + " LEFT • TAP ANY TO JUMP";

  const groups = getSectionGroups();
  let html = "";
  for (const g of groups) {
    const isCurrentGroup = g.blocks.some(x => x.idx === state.index);
    const lastIdx = g.blocks[g.blocks.length - 1].idx;
    const blockWithRound = g.blocks.find(x => x.b.roundTotal);

    let status = "";
    if (isCurrentGroup && blockWithRound) {
      const cur = g.blocks.find(x => x.idx === state.index)?.b?.roundCurrent;
      status = cur ? "ROUND " + cur + " / " + blockWithRound.b.roundTotal : "ACTIVE";
    } else if (state.index > lastIdx) {
      status = "DONE";
    } else if (blockWithRound) {
      status = blockWithRound.b.roundTotal + " ROUNDS";
    } else {
      status = g.blocks.filter(x => x.b.phase !== "rest").length + " EX";
    }

    const visible = g.blocks.filter(x => x.b.phase !== "rest");
    let rowsHtml = "";
    for (const x of visible) {
      const isCurrent = x.idx === state.index;
      const isDone = x.idx < state.index;
      const cls = isCurrent ? "current" : isDone ? "done" : "";
      const tag = x.b.pair ? '<span class="pair-tag">' + x.b.pair + '</span>' : "";
      const roundTag = x.b.roundTotal ? '<span class="round-mini">R' + x.b.roundCurrent + '</span>' : "";
      rowsHtml += '<div class="ov-row ' + cls + '" data-idx="' + x.idx + '">' +
        '<div class="ov-row-name"><span class="ov-marker"></span>' + tag + roundTag + x.b.name + '</div>' +
        '<div class="ov-row-detail">' + (x.b.detail || "") + '</div></div>';
    }
    const secCls = "ov-section " + g.phase + (isCurrentGroup ? " current" : "");
    html += '<div class="' + secCls + '"><div class="ov-sec-head"><div class="ov-sec-label">' + g.label + '</div><div class="ov-sec-status">' + status + '</div></div>' + rowsHtml + '</div>';
  }
  const list = document.getElementById("ov-list");
  list.innerHTML = html;
  list.querySelectorAll(".ov-row").forEach(row => {
    safeTap(row, function(){
      const idx = parseInt(row.dataset.idx);
      if (!isNaN(idx)) jumpToBlock(idx);
      closeOverview();
    });
  });
  // Auto-scroll to current
  setTimeout(() => {
    const cur = list.querySelector(".ov-row.current");
    if (cur) cur.scrollIntoView({ block: "center" });
  }, 50);
}

document.getElementById("ov-close").addEventListener("touchend", function(e){ e.preventDefault(); closeOverview(); });
document.getElementById("ov-close").addEventListener("click", closeOverview);

// ============================================================
// DONE
// ============================================================
function finishWorkout() {
  state.screen = "done";
  clearInterval(state.timerId);
  closeOverview();
  vibrate([200, 100, 200]);
  const elapsed = Math.round((Date.now() - state.startTime) / 60000);
  const w = getWorkout();
  app.innerHTML = '<div class="done">' +
    '<div class="done-icon">✓</div>' +
    '<div class="done-title">DONE</div>' +
    '<div class="done-sub">' + (w ? w.name : "Workout") + ' complete in ' + elapsed + ' minutes. Hydrate, get protein in within an hour.</div>' +
    '<button class="done-btn" id="restart">BACK TO LIBRARY</button></div>';
  const r = document.getElementById("restart");
  r.addEventListener("touchend", function(e){ e.preventDefault(); renderLibrary(); });
  r.addEventListener("click", renderLibrary);
}

renderLibrary();
</script>
</body>
</html>
